<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img" font-family="system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>learning.mycodespace.ai architecture</title>
<desc>Anyone, supervisors and students reach a global HTTPS load balancer with Cloud Armor. It routes to the public open site bucket, the public sign-in page, the open API protected by IAP with the applicants tenant, and club sites protected by IAP with supervisors and per-club student tenants. Behind them are Identity Platform, Cloud Run services, and Firestore with Pub/Sub.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#2C2C2A}.g .ts{fill:#5F5E5A}
.a rect{fill:#FAEEDA;stroke:#BA7517}.a .th{fill:#633806}.a .ts{fill:#854F0B}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#04342C}.t .ts{fill:#085041}
.lg{font-size:12px;fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#1F1F1E}.arr{stroke:#B4B2A9}.lg{fill:#B4B2A9}
.g rect{fill:#444441;stroke:#B4B2A9}.g .th{fill:#F1EFE8}.g .ts{fill:#D3D1C7}
.a rect{fill:#633806;stroke:#FAC775}.a .th{fill:#FAEEDA}.a .ts{fill:#FAC775}
.t rect{fill:#085041;stroke:#9FE1CB}.t .th{fill:#E1F5EE}.t .ts{fill:#9FE1CB}}
</style>
</defs>
<rect class="bg" x="0" y="0" width="680" height="510"/>

<g class="g"><rect x="40" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="50" text-anchor="middle" dominant-baseline="central">Anyone</text>
<text class="ts" x="130" y="70" text-anchor="middle" dominant-baseline="central">No account</text></g>
<g class="a"><rect x="250" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Supervisor</text>
<text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Sign in with Google</text></g>
<g class="t"><rect x="460" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="50" text-anchor="middle" dominant-baseline="central">Student</text>
<text class="ts" x="550" y="70" text-anchor="middle" dominant-baseline="central">Club username + password</text></g>

<line x1="130" y1="86" x2="130" y2="123" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="123" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="86" x2="550" y2="123" class="arr" marker-end="url(#arrow)"/>

<g class="g"><rect x="30" y="125" width="610" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="335" y="145" text-anchor="middle" dominant-baseline="central">Global HTTPS load balancer + Cloud Armor</text>
<text class="ts" x="335" y="165" text-anchor="middle" dominant-baseline="central">Wildcard cert, host rules, per-IP rate limits</text></g>

<line x1="102" y1="185" x2="102" y2="223" class="arr" marker-end="url(#arrow)"/>
<line x1="257" y1="185" x2="257" y2="223" class="arr" marker-end="url(#arrow)"/>
<line x1="412" y1="185" x2="412" y2="223" class="arr" marker-end="url(#arrow)"/>
<line x1="567" y1="185" x2="567" y2="223" class="arr" marker-end="url(#arrow)"/>

<g class="g"><rect x="30" y="225" width="145" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="102" y="250" text-anchor="middle" dominant-baseline="central">open.* site</text>
<text class="ts" x="102" y="272" text-anchor="middle" dominant-baseline="central">Public bucket</text>
<text class="ts" x="102" y="290" text-anchor="middle" dominant-baseline="central">+ Cloud CDN</text></g>
<g class="g"><rect x="185" y="225" width="145" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="250" text-anchor="middle" dominant-baseline="central">auth.* sign-in</text>
<text class="ts" x="257" y="272" text-anchor="middle" dominant-baseline="central">Public page</text>
<text class="ts" x="257" y="290" text-anchor="middle" dominant-baseline="central">FirebaseUI</text></g>
<g class="a"><rect x="340" y="225" width="145" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="412" y="250" text-anchor="middle" dominant-baseline="central">open.* /api</text>
<text class="ts" x="412" y="272" text-anchor="middle" dominant-baseline="central">IAP tenant:</text>
<text class="ts" x="412" y="290" text-anchor="middle" dominant-baseline="central">applicants</text></g>
<g class="t"><rect x="495" y="225" width="145" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="250" text-anchor="middle" dominant-baseline="central">galati.* web+api</text>
<text class="ts" x="567" y="272" text-anchor="middle" dominant-baseline="central">IAP tenants:</text>
<text class="ts" x="567" y="290" text-anchor="middle" dominant-baseline="central">supervisors,</text>
<text class="ts" x="567" y="306" text-anchor="middle" dominant-baseline="central">students-galati</text></g>

<path d="M 257 321 L 257 345 L 130 345 L 130 378" class="arr" marker-end="url(#arrow)"/>
<path d="M 412 321 L 412 355 L 320 355 L 320 378" class="arr" marker-end="url(#arrow)"/>
<path d="M 567 321 L 567 355 L 360 355 L 360 378" class="arr" marker-end="url(#arrow)"/>

<g class="g"><rect x="30" y="380" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="404" text-anchor="middle" dominant-baseline="central">Identity Platform</text>
<text class="ts" x="130" y="426" text-anchor="middle" dominant-baseline="central">Tenants, blocking functions</text></g>
<g class="g"><rect x="250" y="380" width="180" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="404" text-anchor="middle" dominant-baseline="central">Cloud Run</text>
<text class="ts" x="340" y="426" text-anchor="middle" dominant-baseline="central">Capped instances</text></g>
<g class="g"><rect x="450" y="380" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="404" text-anchor="middle" dominant-baseline="central">Firestore + Pub/Sub</text>
<text class="ts" x="545" y="426" text-anchor="middle" dominant-baseline="central">Requests, users, status</text></g>
<line x1="430" y1="415" x2="448" y2="415" class="arr" marker-end="url(#arrow)"/>

<rect x="30" y="476" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="lg" x="48" y="486">Public</text>
<rect x="110" y="476" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="lg" x="128" y="486">Any Google account</text>
<rect x="260" y="476" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="lg" x="278" y="486">Approved supervisors and issued students only</text>
</svg>
